<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QCSI frame — sponsor thank-you</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="sponsor-thankyou.css">
<style>
  html,body{width:1080px;height:1080px;}
  /* BLANK FRAME. The photo is a flat grey placeholder rather than an image, so this
     file carries no artist or sponsor likeness and can sit on a public URL. Drop a
     photo into the frame in Canva. */
  .shot{background:#9A9A96;filter:none;}
  /* Exact-size PDF for Canva import. The @page is 6px under the 1080px body ON
     PURPOSE, so the art bleeds off the trim rather than leaving a pale hairline. Canva's HTML importer reflows the document and
     throws the CSS layout away; a PDF keeps the geometry and the text stays editable.
     html gets the field colour too, or a fractional page/body mismatch leaves a pale
     strip down the trim edge. */
  @page{size:1074px 1074px;margin:0;}
  @media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
               html{background:#0F0F11;}
}
</style>
</head>
<body class="sq-sponsor" data-document-role="page" data-label="Sponsor thank-you">

  <span class="tape-strip">2026 Invitational Sponsor</span>

  <div class="paper-block">
    <div class="shot"></div>
  </div>

  <div class="capline">
    <span class="run run--dim">Month 00, 2026</span>
    <span class="run run--tape">Invitational &middot; September 25 &amp; 26</span>
  </div>

  <div class="copy">
    <p class="thanks">Thank You</p>
    <p class="sponsor">Sponsor Name</p>
    <p class="tier run">Songsmith Sponsor</p>
    <p class="because">
      One line of thanks goes here.
    </p>

    <div class="foot">
      <span class="url run">qcsongwriters.com</span>
    </div>
  </div>

  <img class="logo" src="https://www.qcsongwriters.com/brand/qcsi-logo-stacked.svg" alt="Queen City Songwriters">

</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QCSI frame — artist angle</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="artist-spotlight.css">
<style>
  html,body{width:1080px;height:1080px;}
  /* BLANK FRAME. The photo is a flat grey placeholder rather than an image, so this
     file carries no artist or sponsor likeness and can sit on a public URL. Drop a
     photo into the frame in Canva. */
  .shot{background:#9A9A96;filter:none;}
</style>
</head>
<body class="sq v-angle" data-document-role="page" data-label="Artist angle">
  <div class="shot cut"></div>

  <img class="logo" src="https://www.qcsongwriters.com/brand/qcsi-logo-stacked.svg" alt="Queen City Songwriters">

  <div class="copy">
    <span class="badge">Invitational Artist &middot; 2026</span>

    <div class="aname" role="img" aria-label="Artist Name">
      <svg class="slug" viewBox="0 0 1000 222" aria-hidden="true">
        <text class="s" x="0" y="219" textLength="1000" lengthAdjust="spacingAndGlyphs" font-size="270">FIRST</text>
      </svg>
      <svg class="slug" viewBox="0 0 1000 222" aria-hidden="true">
        <text class="s" x="0" y="219" textLength="1000" lengthAdjust="spacingAndGlyphs" font-size="270">LAST</text>
      </svg>
    </div>

    <p class="home">Hometown, State</p>
    <div class="rule-thin"></div>
    <p class="lyric">
      &ldquo;A line of the lyric goes here, one or two lines long&rdquo;
    </p>
    <p class="qmeta run">Signature song &ldquo;Title&rdquo;</p>
    <p class="infl run run--dim">Instrument &middot; or influences</p>
    <div class="foot">
      <span class="url run">qcsongwriters.com</span>
      <span class="dot">&middot;</span>
      <span class="handle run run--tape">@handle</span>
    </div>
  </div>

  <div class="tooth"></div>
</body>
</html>

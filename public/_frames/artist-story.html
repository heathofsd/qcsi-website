<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QCSI frame — artist story</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="artist-spotlight.css">
<style>
  html,body{width:1080px;height:1920px;}
  /* BLANK FRAME. The photo is a flat grey placeholder rather than an image, so this
     file carries no artist or sponsor likeness and can sit on a public URL. Drop a
     photo into the frame in Canva. */
  .shot{background:#9A9A96;filter:none;}
  /* Exact-size PDF for Canva import. The @page is 6px under the 1080px body ON
     PURPOSE, so the art bleeds off the trim rather than leaving a pale hairline. Canva's HTML importer reflows the document and
     throws the CSS layout away; a PDF keeps the geometry and the text stays editable.
     html gets the field colour too, or a fractional page/body mismatch leaves a pale
     strip down the trim edge. */
  @page{size:1074px 1910px;margin:0;}
  @media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
               html{background:#F4F5F2;}
}
</style>
</head>
<body class="" data-document-role="page" data-label="Artist story">
  <div class="shot cut"></div>

  <img class="logo" src="https://www.qcsongwriters.com/brand/qcsi-logo-stacked.svg" alt="Queen City Songwriters">

  <div class="copy">
    <span class="badge">Invitational Artist &middot; 2026</span>

    <div class="aname" role="img" aria-label="Artist Name">
      <svg class="slug" viewBox="0 0 1000 98" aria-hidden="true">
        <text class="s" x="0" y="95" textLength="1000" lengthAdjust="spacingAndGlyphs" font-size="116">FIRST LAST</text>
      </svg>
    </div>

    <p class="home">Hometown, State</p>
    <div class="rule-thin"></div>
    <p class="lyric">
      &ldquo;A line of the lyric goes here, one or two lines long&rdquo;
    </p>
    <p class="qmeta run">Signature song &ldquo;Title&rdquo;</p>
    <div class="foot">
      <span class="url run">qcsongwriters.com</span>
      <span class="dot">&middot;</span>
      <span class="handle run run--tape">@handle</span>
    </div>
  </div>

  <div class="tooth"></div>
</body>
</html>
